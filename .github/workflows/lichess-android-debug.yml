name: Lichess fork Android debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out fork
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter version required by Lichess
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Generate models
        run: dart run build_runner build
      - name: Format changed Dart files
        run: dart format lib/src/view/offline_computer/offline_computer_game_screen.dart lib/src/view/offline_computer/practice_coach_sheet.dart test/view/offline_computer/practice_coach_sheet_test.dart lib/src/view/analysis/analysis_screen.dart
      - name: Analyze changed code
        run: flutter analyze lib/src/view/offline_computer/offline_computer_game_screen.dart lib/src/view/offline_computer/practice_coach_sheet.dart test/view/offline_computer/practice_coach_sheet_test.dart lib/src/view/analysis/analysis_screen.dart lib/src/model/settings/board_preferences.dart
      - name: Run coaching handoff tests
        run: flutter test test/view/offline_computer/practice_coach_sheet_test.dart
      - name: Build Android debug APK
        run: >-
          flutter build apk --debug
          --dart-define=LICHESS_HOST=lichess.org
          --dart-define=LICHESS_WS_HOST=socket.lichess.org
      - name: Downloadable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: lichess-fork-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
          if-no-files-found: error
